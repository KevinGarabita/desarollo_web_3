apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: fast-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fast-backend
  template:
    metadata:
      labels:
        app: fast-backend
    spec:
      containers:
        - name: backend-fast
          image: ghcr.io/sergiomdza/desarollo_web_3:Kevin_Garabita2-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
